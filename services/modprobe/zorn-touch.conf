# focaltech-spi-ts calls crc_ccitt() but was built as a single make target, so
# modpost never recorded the dependency and modinfo shows no "depends". Loading
# crc-ccitt first satisfies the symbol at insmod time.
softdep focaltech-spi-ts pre: crc-ccitt

# spi@a90000 wants GPI DMA channels, and gpi.ko is a module here. Without it
# spi-geni-qcom returns -EPROBE_DEFER ("Failed to get tx DMA ch") and, if the
# deferred-probe timeout expires first, gives up permanently -- the same trap
# msm-mdss fell into over dispcc. Load it ahead of the controller.
softdep spi-geni-qcom pre: gpi

# raw_dump=<n> hex-dumps the first n bytes of every touch frame AND logs each
# reported contact as "slot N down at (x, y)". 84 is a whole v2 frame. This is
# the diagnostic to reach for first, because unlike reading /dev/input/eventN it
# needs no coordination with whoever is touching the glass -- three separate
# "0 events" readings during bring-up were capture-window and buffering
# artefacts, not driver faults.
#options focaltech-spi-ts raw_dump=84

# thp_mode=1 leaves the firmware in Xiaomi's raw-AFE streaming mode, which
# reports no contacts at all. Only useful for looking at frame_afe_data.
#options focaltech-spi-ts thp_mode=1
